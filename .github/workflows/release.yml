name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  discussions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No SDK setup step: ubuntu-latest ships the Android SDK preinstalled
      # (licenses pre-accepted) and AGP fetches any missing components.
      # android-actions/setup-android@v3 is broken anyway - it installs the
      # removed 'tools' package and fails.

      - name: Decode signing keystore
        run: echo "${{ secrets.KEY_STORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/medrx-release.jks"

      - name: Assemble signed release APKs
        env:
          KEY_STORE_FILE: ${{ runner.temp }}/medrx-release.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename APKs with version
        run: |
          V="${{ steps.version.outputs.name }}"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/MedRx-$V-phone.apk"
          mv wear/build/outputs/apk/release/wear-release.apk "wear/build/outputs/apk/release/MedRx-$V-wear.apk"

      - name: Create GitHub Release with signed APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Med Rx ${{ steps.version.outputs.name }}
          body: |
            Med Rx ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            **Med Rx is a community fork of [Med by FeDeveloper95](https://github.com/FeDeveloper95/Med) (Apache 2.0), maintained by nukirk.**

            ## What's new
            - **A snooze limit that ends the loop**: cap repeated snoozes and choose what the dose becomes — a recorded skip, or a postponement to its next scheduled slot. A reminder that keeps getting pushed can no longer quietly fall off the adherence record
            - **Postponed doses are their own state**: a dose delayed by the limit is tracked separately from true skips and misses in Stats, the calendar legend and the card, and is never counted as refused
            - **Swipe the card**: right to skip a dose, left to delete it — both behind a confirmation, and the delete snackbar offers Undo. A one-time hint teaches the gestures
            - **Skips explain themselves**: the clinical reason and your note now appear on the med card, and the note stays editable by tapping that line — no un-skip and re-skip to fix a hurried note
            - **Localized clinical reasons**: reason chips and card labels now use the translated reason strings in every supported language
            - **Custom snooze durations**: snooze in whole hours or a custom minute length, set from the alarm

            ## Fork features
            - Symptom logging with severity (mild / moderate / severe) and an editable date and time
            - Skip and refill actions beside the taken circle on med cards
            - Dose skipping with 8 clinical reasons + optional note
            - Pre-skip future doses (travel, fasting, procedures)
            - Supply ledger with full stock-change traceability
            - Idempotent dose logging — stock always matches the bottle
            - Skipped-dose doctor report (CSV export)
            - Crash fix for dose reduction on Android 14 and below ([upstream #19](https://github.com/FeDeveloper95/Med/issues/19))

            ## Install
            - Download **MedRx-…-phone.apk** for your phone
            - Download **MedRx-…-wear.apk** for Wear OS (install on the watch)
            - Minimum Android 8.0 (API 26); watch requires Wear OS 3+
            - Updating from Med Rx 2.2.2-fork.1 or earlier? Install straight over it — same app (`com.nukirk.medrx`), same signing key, all data stays. Version 2.2.3-fork.1 is versionCode 25.
            - Coming from the original Med app? Install alongside — your data migrates via in-app backup/restore or CSV export/import.
          files: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

  announce:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Post release announcement to Discussions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          RELEASE_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .html_url)
          VERSION="${TAG#v}"

          # Find the "Announcements" category (fall back to the first category)
          CATEGORY_ID=$(gh api graphql -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){discussionCategories(first:10){nodes{id name}}}}' \
            -f o="${GITHUB_REPOSITORY%%/*}" -f r="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.discussionCategories.nodes | (map(select(.name == "Announcements")) // []) + . | first | .id')

          BODY=$(cat <<EOF
          ## Med Rx $VERSION is out

          [Download it from the release page]($RELEASE_URL).

          **Med Rx is a community fork of [Med by FeDeveloper95](https://github.com/FeDeveloper95/Med) (Apache 2.0).**

          New in this build: a snooze limit that converts repeated snoozes into a recorded skip or a postponement to the next scheduled slot (tracked separately from missed doses), swipe gestures on med cards — right to skip, left to delete, both behind a confirmation and with Undo on delete — skip reasons and notes shown on the card with the note editable afterwards, a one-time hint for the gestures, custom snooze lengths, and clinical reason labels that now use the translated strings. Version 2.2.3-fork.1 is versionCode 25, signed with the same key as 2.2.2, so installing straight over it keeps your data. The full fork feature set (dose skipping with clinical reasons, pre-skip planning, the supply ledger, PRN support, symptom logging, the skipped-dose doctor report, the Android 14 dose-reduction crash fix) is unchanged. Details are in the release notes.

          Questions or problems? Open an issue, or ask here in Discussions — every release gets a thread like this one.
          EOF
          )

          gh api graphql \
            -f query='mutation($r:ID!,$c:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$r,categoryId:$c,title:$t,body:$b}){discussion{url}}}' \
            -f r="$(gh api "repos/$GITHUB_REPOSITORY" --jq .node_id)" \
            -f c="$CATEGORY_ID" \
            -f t="Med Rx $VERSION released" \
            -f b="$BODY" \
            --jq '.data.createDiscussion.discussion.url' \
            && echo "Announcement posted."
